name: Audit safeguards
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Install join-test dependency
        run: Rscript --vanilla -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - name: Parse R sources and test commander invariants
        run: |
          Rscript --vanilla -e 'for (d in c("audit", "analysis/code", "build/code", "functions")) for (f in list.files(d, pattern="[.]R$", recursive=TRUE, full.names=TRUE)) parse(f); source("audit/tests/test_commander.R")'
      - name: Check publication scope across branch history
        run: python3 audit/check_publication.py origin/master
